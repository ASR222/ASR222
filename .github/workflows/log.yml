name: Update profile log

on:
  schedule:
    - cron: "45 18 * * *" # daily, after the Boot.dev tracker
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update_log.py, .github/workflows/log.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the log table
        run: python3 scripts/update_log.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || { git commit -m "Update profile log"; git push; }
