<svg xmlns="http://www.w3.org/2000/svg" width="600" height="352" viewBox="0 0 600 352" role="img" aria-label="A CortexAI chat: who is Abhay, what has he shipped, is he open to work">
<style>
.w{width:600px;height:352px;background:#ffffff;color:#18181b;font:13px/1.45 -apple-system,'Segoe UI',Inter,Ubuntu,Helvetica,Arial,sans-serif;border-radius:12px;overflow:hidden;box-sizing:border-box}
.top{display:flex;justify-content:space-between;align-items:center;padding:9px 16px;background:#f4f4f5;font-size:13px}
.top b{font-weight:650}.top span{color:#71717a;font-size:12px}
.c{padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.u{display:flex;justify-content:flex-end}
.u span{background:#ececef;padding:5px 12px;border-radius:14px}
.slot{display:grid}.slot>*{grid-area:1/1}
.b{max-width:500px}.r{color:#0b8fc4;font-size:11.5px;margin-bottom:1px}
.in{opacity:0;animation:in .45s ease-out forwards}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.dots{opacity:0;align-self:start;padding:8px 0;animation:blink 1.1s linear forwards}
.dots i{display:inline-block;width:6px;height:6px;margin-right:4px;border-radius:50%;background:#71717a;animation:bob .9s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%{opacity:0}10%,90%{opacity:1}100%{opacity:0}}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-3px)}}
@media (prefers-reduced-motion:reduce){.in{animation:none;opacity:1}.dots{display:none}}
</style>
<foreignObject width="600" height="352"><div xmlns="http://www.w3.org/1999/xhtml" class="w">
<div class="top"><b>CortexAI</b><span>Who is Abhay?</span></div>
<div class="c"><div class="u in" style="animation-delay:0.3s"><span>Who is Abhay?</span></div><div class="slot"><div class="dots" style="animation-delay:0.8s"><i></i><i></i><i></i></div><div class="b in" style="animation-delay:1.9s"><div class="r">Chat · 1 credit</div>An AI and cloud engineer in India. He builds multi-agent systems in Go and Python, and runs them on Google Cloud and AWS.</div></div><div class="u in" style="animation-delay:3.2s"><span>What has he shipped?</span></div><div class="slot"><div class="dots" style="animation-delay:3.7s"><i></i><i></i><i></i></div><div class="b in" style="animation-delay:4.8s"><div class="r">Chat · 1 credit</div>Me, for a start: I'm CortexAI. Also HazeBusters, air quality for places with no monitor, and MemLedger, shared memory for agent teams.</div></div><div class="u in" style="animation-delay:6.1s"><span>Is he open to work?</span></div><div class="slot"><div class="dots" style="animation-delay:6.6s"><i></i><i></i><i></i></div><div class="b in" style="animation-delay:7.7s"><div class="r">Chat · 1 credit</div>Yes, to software and AI engineering roles. LinkedIn is the quickest way to reach him.</div></div></div>
</div></foreignObject>
</svg>
